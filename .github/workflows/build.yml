name: Build website + Android app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: build
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy1.outputs.page_url || steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install --no-audit --no-fund
      - run: bash scripts/build.sh
      - uses: actions/upload-artifact@v4
        with: { name: site, path: dist, include-hidden-files: true }
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with: { path: dist }
      - name: Wait for the artifact to register
        run: sleep 15
      - id: deploy1
        continue-on-error: true
        uses: actions/deploy-pages@v4
      - name: Retry pause
        if: steps.deploy1.outcome == 'failure'
        run: sleep 30
      - id: deploy
        if: steps.deploy1.outcome == 'failure'
        uses: actions/deploy-pages@v4

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: npm install --no-audit --no-fund
      - run: npx cap sync android
      - name: Build signed APK
        working-directory: android
        env:
          APP_VERSION_CODE: ${{ github.run_number }}
        run: |
          export APP_VERSION_NAME=$(cat ../VERSION)
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk ../Beza-Youth-Worship-Team.apk
      - uses: actions/upload-artifact@v4
        with: { name: BezaYouth-apk, path: Beza-Youth-Worship-Team.apk }
      - name: Publish APK download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-app
          name: Beza Youth — Android app
          body: |
            Download **Beza-Youth-Worship-Team.apk** below and open it on your Android phone to install.
            The app updates itself from the website — you only reinstall when the app tells you to.
          files: Beza-Youth-Worship-Team.apk
          make_latest: true

  firebase:
    needs: [web, android]
    runs-on: ubuntu-latest
    env:
      HAS_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT != '' }}
    steps:
      - uses: actions/checkout@v4
      - if: env.HAS_KEY == 'true'
        uses: actions/download-artifact@v4
        with: { name: site, path: site }
      - if: env.HAS_KEY == 'true'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: beza-youth
          channelId: live
      - if: env.HAS_KEY != 'true'
        run: echo "No FIREBASE_SERVICE_ACCOUNT secret yet - skipping beza-youth.web.app deploy"
