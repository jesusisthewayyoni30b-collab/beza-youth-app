name: Build website + Android app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: build
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install --no-audit --no-fund
      - run: bash scripts/build.sh
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: dist }
      - id: deploy
        uses: actions/deploy-pages@v4

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: npm install --no-audit --no-fund
      - run: npx cap sync android
      - name: Build signed APK
        working-directory: android
        env:
          APP_VERSION_CODE: ${{ github.run_number }}
        run: |
          export APP_VERSION_NAME=$(cat ../VERSION)
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk ../BezaYouth.apk
      - uses: actions/upload-artifact@v4
        with: { name: BezaYouth-apk, path: BezaYouth.apk }
      - name: Publish APK download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-app
          name: Beza Youth — Android app
          body: |
            Download **BezaYouth.apk** below and open it on your Android phone to install.
            The app updates itself from the website — you only reinstall when the app tells you to.
          files: BezaYouth.apk
          make_latest: true
