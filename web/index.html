/* clean-slate reset: when leaders bump "epoch", every device forgets local data and signs out before the app starts */
(function(){try{var x=new XMLHttpRequest();x.open("GET","version.json?t="+Date.now(),false);x.send();if(x.status!==200)return;var v=JSON.parse(x.responseText);if(!v.epoch||localStorage.getItem("beza-epoch")===v.epoch)return;
Object.keys(localStorage).forEach(function(k){localStorage.removeItem(k)});try{sessionStorage.clear()}catch(e){}
["firebaseLocalStorageDb","firestore/[DEFAULT]/beza-youth/main","firebase-heartbeat-database","firebase-installations-database"].forEach(function(n){try{indexedDB.deleteDatabase(n)}catch(e){}});
if(indexedDB.databases)indexedDB.databases().then(function(d){d.forEach(function(x){if(x.name&&/fire/i.test(x.name))indexedDB.deleteDatabase(x.name)})});
localStorage.setItem("beza-epoch",v.epoch)}catch(e){}})();
</script>
